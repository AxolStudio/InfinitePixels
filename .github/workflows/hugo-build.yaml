name: Build and Deploy Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Haxe
        run: |
          sudo add-apt-repository ppa:haxe/releases -y
          sudo apt-get update
          sudo apt-get install haxe -y --quiet

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: $HOME/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('infinite-engine/project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Install OpenFL
        run: |
          if ! haxelib list | grep -q '^openfl:'; then
            haxelib install openfl --quiet
          fi

      - name: Install Lime
        run: |
          if ! haxelib list | grep -q '^lime:'; then
            haxelib install lime --quiet
          fi

      - name: Build Haxe project
        run: lime build html5 -clean -final
        working-directory: infinite-engine

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build Hugo site
        run: npm run build
        working-directory: site

      - name: Verify Pages artifact
        run: test -f public/index.html
        working-directory: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
