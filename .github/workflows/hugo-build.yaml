name: ⚙ Build the Hugo Site

on: 
  workflow_call:
    outputs: 
      base_url: 
        description: "The Base URL of the site"
        value: ${{ jobs.build.outputs.base_url }}
  push:
    branches:
      - main
    tags-ignore:
      - generated.**
    pull_request:
        branches:
            - main
  workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "pages"
    cancel-in-progress: false

defaults:
    run:
        shell: bash
    
jobs:
    build: 
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            HUGO_VERSION: 0.164.0
        outputs:
            base_url: ${{ steps.pages.outputs.base_url }}
        steps:
            -   name: Install Hugo CLI
                run: |
                    wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
                    && sudo dpkg -i ${{ runner.temp }}/hugo.deb
            -   name: Install Dart Sass
                run: sudo snap install dart-sass
            -   name: Checkout
                uses: actions/checkout@v4
                with: 
                    submodules: recursive
                    fetch-depth: 0
            -   name: Pull
                run: git pull
            -   name: Get Haxe
                run: |
                  sudo add-apt-repository ppa:haxe/releases -y
                  sudo apt-get update
                  sudo apt-get install haxe -y --quiet
                  mkdir ~/haxelib && haxelib setup ~/haxelib
            -   name: Cache Haxelib
                uses: actions/cache@v4
                with:
                    path: ~/haxelib
                    key: ${{ runner.os }}-haxelib-${{ hashFiles('infinite-engine/project.xml') }}
                    restore-keys: |
                        ${{ runner.os }}-haxelib-
            -   name: Install OpenFL
                run: |
                    if ! haxelib list | grep -q '^openfl:'; then
                        haxelib install openfl --quiet
                    fi
            -   name: Install Lime
                run: |
                    if ! haxelib list | grep -q '^lime:'; then
                        haxelib install lime --quiet
                    fi
            -   name: Setup Lime
                run: haxelib run lime setup -y
            -   name: build project
                run: lime build html5 -clean -final
                working-directory: infinite-engine
            -   name: Setup Pages
                id: pages
                uses: actions/configure-pages@v3
            -   name: Setup Node
                uses: actions/setup-node@v3
                with:
                    node-version: 20.10.0
                    cache: npm
                    cache-dependency-path: site/package-lock.json
            -   name: Install dependencies
                run: npm ci
                working-directory: site
            -   name: Build
                env:
                    HUGO_ENVIRONMENT: production
                    HUGO_ENV: production
                    SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}/"
                run: npm run build
                working-directory: .
            -   name: Verify Pages Artifact
                run: |
                    test -f site/public/index.html
            -   name: Smoke Test Home Markup
                run: |
                    grep -q 'id="engine-content"' site/public/index.html
            -   name: Upload Artifact
                uses: actions/upload-pages-artifact@v2
                with: 
                    path: ./site/public
    
    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: 
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            pages: write
            id-token: write
        outputs:
            base_url: ${{ needs.build.outputs.base_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            -   name: Deploy
                id: deployment
                uses: actions/deploy-pages@v2